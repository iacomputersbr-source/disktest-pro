name: Build DiskTest Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download smartctl (motor SMART)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          choco install smartmontools -y --no-progress
          $exe = Get-ChildItem -Recurse -Path "C:\Program Files\smartmontools" -Filter smartctl.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Recurse -Path "C:\Program Files (x86)\smartmontools" -Filter smartctl.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $exe) { throw "smartctl.exe no encontrado tras instalar smartmontools" }
          Copy-Item $exe.FullName "src-tauri/binaries/smartctl-x86_64-pc-windows-msvc.exe"
          Write-Host "smartctl copiado: $($exe.FullName)"

      - name: Install frontend deps
        run: npm install

      - name: Ensure icon exists
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.png")) {
            New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap(512,512)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(26,26,46))
            $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255,107,53))
            $g.FillEllipse($brush, 56, 56, 400, 400)
            $font = New-Object System.Drawing.Font("Arial", 200, [System.Drawing.FontStyle]::Bold)
            $sf = New-Object System.Drawing.StringFormat
            $sf.Alignment = "Center"; $sf.LineAlignment = "Center"
            $g.DrawString("DT", $font, [System.Drawing.Brushes]::White, (New-Object System.Drawing.RectangleF(0,0,512,512)), $sf)
            $bmp.Save("src-tauri/icons/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "Icono generado automaticamente"
          } else { Write-Host "icon.png ya existe, se usa el tuyo" }

      - name: Generate icons
        run: npx @tauri-apps/cli@2 icon src-tauri/icons/icon.png

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiskTestPro-windows
          path: src-tauri/target/release/bundle/
