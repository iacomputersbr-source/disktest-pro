[package]
name = "disktest-pro"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winapi = { version = "0.3", features = ["fileapi", "handleapi", "winnt", "minwindef"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
